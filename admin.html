<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kapil Medical Admin</title>
<style>body{font-family:system-ui;margin:0;background:#f4f7f6;color:#17202a}header{background:#17202a;color:#fff;padding:16px}.wrap{max-width:1100px;margin:auto;padding:22px}.panel{background:#fff;padding:18px;border-radius:14px;margin:16px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{background:#fff;padding:16px;border-radius:12px}.stat b{font-size:25px;color:#087f5b}button{background:#087f5b;color:#fff;border:0;padding:9px 13px;border-radius:8px;font-weight:700}input,select{padding:9px;width:100%;box-sizing:border-box;margin:4px 0 10px;border:1px solid #ccd5df;border-radius:7px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #eee}.danger{background:#ffe3e3;color:#900}.login{max-width:400px;margin:80px auto;background:#fff;padding:24px;border-radius:15px}.muted{font-size:13px;color:#66737b}</style></head>
<body><header><b>💚 Kapil Medical — Secure Admin</b></header><div id="login" class="login"><h2>Admin Login</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Sign in</button><p id="e" class="muted"></p></div>
<main id="app" class="wrap" style="display:none"><button onclick="logout()">Logout</button><div class="stats"><div class="stat">Products<br><b id="pc">0</b></div><div class="stat">Orders<br><b id="oc">0</b></div><div class="stat">Pending<br><b id="pend">0</b></div><div class="stat">Sales<br><b>₹<span id="sales">0</span></b></div></div>
<section class="panel"><h2>Products</h2><button onclick="addProduct()">+ Add</button><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Rx</th><th></th></tr></thead><tbody id="pr"></tbody></table></div></section>
<section class="panel"><h2>Orders</h2><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody id="or"></tbody></table></div></section></main>
<script>
let products=[],orders=[];
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})}),j=await r.json();if(!r.ok)return e.textContent=j.error;show()}
async function show(){loginEl.style.display="none";app.style.display="block";await refresh()}
const loginEl=document.getElementById("login");
async function refresh(){products=await fetch("/api/admin/products").then(r=>r.json());orders=await fetch("/api/admin/orders").then(r=>r.json());pc.textContent=products.length;oc.textContent=orders.length;pend.textContent=orders.filter(x=>x.status==="Pending").length;sales.textContent=orders.reduce((a,x)=>a+x.total,0);pr.innerHTML=products.map(p=>`<tr><td>${p.name}</td><td>${p.category}</td><td>₹${p.price}</td><td>${p.stock}</td><td>${p.prescription_required?"Yes":"No"}</td><td><button onclick="editProduct(${p.id})">Edit</button> <button class="danger" onclick="delProduct(${p.id})">Delete</button></td></tr>`).join("");or.innerHTML=orders.map(o=>`<tr><td>KM${o.id}</td><td>${o.customer_name}</td><td>₹${o.total}</td><td>${o.payment_method}</td><td><select onchange="status(${o.id},this.value)">${["Pending","Confirmed","Shipped","Delivered","Cancelled"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}
async function status(id,s){await fetch("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:s})});refresh()}
async function addProduct(){let name=prompt("Product name");if(!name)return;let price=+prompt("Price");let stock=+prompt("Stock");let category=prompt("Category: Medicine or Cosmetics","Medicine");let rx=confirm("Prescription required?");await fetch("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,price,stock,category,prescription_required:rx})});refresh()}
async function editProduct(id){let p=products.find(x=>x.id===id);let name=prompt("Name",p.name);if(name===null)return;let price=+prompt("Price",p.price),stock=+prompt("Stock",p.stock),category=prompt("Category",p.category),rx=confirm("Prescription required?");await fetch("/api/admin/products/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,price,stock,category,prescription_required:rx})});refresh()}
async function delProduct(id){if(!confirm("Delete product?"))return;await fetch("/api/admin/products/"+id,{method:"DELETE"});refresh()}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}
fetch("/api/me").then(r=>r.json()).then(x=>{if(x.authenticated)show()});
</script></body></html>
