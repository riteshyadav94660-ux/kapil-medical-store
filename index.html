<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kapil Medical</title>
<style>body{font-family:system-ui;margin:0;background:#f5f8f7;color:#17202a}header{background:#087f5b;color:#fff;padding:16px;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.card{background:#fff;padding:16px;border-radius:14px}.pic{height:100px;background:#edf8f3;border-radius:10px;display:grid;place-items:center;font-size:42px}button{background:#087f5b;color:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:700}input,select,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccd5df;border-radius:8px;box-sizing:border-box}.muted{color:#66737b;font-size:13px}.cart{background:#fff;color:#087f5b;float:right}</style></head>
<body><header>💚 Kapil Medical <button class="cart" onclick="document.getElementById('checkout').scrollIntoView()">Cart: <span id="n">0</span></button></header>
<main class="wrap"><h1>Medicines & Cosmetics</h1><p>Pan-India delivery • Alamgirpur, Rewari, Haryana</p><div id="products" class="grid"></div><section id="checkout"><h2>Checkout</h2><div id="cart"></div><input id="name" placeholder="Full name"><input id="phone" placeholder="Mobile number"><textarea id="address" placeholder="Complete address"></textarea><input id="pin" placeholder="PIN code"><select id="pay"><option>Cash on Delivery</option><option>Online payment — Razorpay</option></select><p><b>Order Total: ₹<span id="total">0</span></b></p><button onclick="order()">Place order</button><p id="msg" class="muted"></p></section></main>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>let ps=[],cart=[];async function load(){
try{
const res=await fetch("/api/products");
const data=await res.json();
ps=data;

const box=document.getElementById("products");

box.innerHTML=data.map(p=>`
<div class="card">
<div class="pic">${p.category==="Medicine"?"💊":"🧴"}</div>
<h3>${p.name}</h3>
<p>₹${p.price} • Stock ${p.stock}</p>
<p class="muted">${p.prescription_required?"Prescription verification required":""}</p>
<button type="button" onclick="add(${p.id})">Add to cart</button>
</div>
`).join("");
}catch(e){
console.error(e);
document.getElementById("products").innerHTML="<p style='color:red'>ERROR: "+e.message+"</p>";
}
function renderCart(){
let box=document.getElementById("cartItems");
if(!box){
box=document.createElement("div");
box.id="cartItems";
document.getElementById("name").before(box);
}
const grouped={};
cart.forEach(x=>{
if(!grouped[x.id])grouped[x.id]={...x,qty:0};
grouped[x.id].qty++;
});

box.innerHTML=Object.values(grouped).map(x=>`
<div style="padding:8px 0;border-bottom:1px solid #ddd">
<b>${x.name}</b> - ₹${x.price}
<br>
<button type="button" onclick="changeQty(${x.id},-1)">−</button>
<span style="margin:0 10px">${x.qty}</span>
<button type="button" onclick="changeQty(${x.id},1)">+</button>
<button type="button" onclick="removeItem(${x.id})">🗑️</button>
</div>
`).join("");

document.querySelector(".cart").textContent="Cart ("+cart.length+")";
document.getElementById("total").textContent=cart.reduce((a,x)=>a+Number(x.price),0);
}

window.add=function(id){
const p=ps.find(x=>x.id===id);
if(!p)return;
cart.push(p);
renderCart();
};

window.changeQty=function(id,change){
const index=cart.findIndex(x=>x.id===id);

if(change===1){
const p=ps.find(x=>x.id===id);
if(p)cart.push(p);
}else if(change===-1 && index!==-1){
cart.splice(index,1);
}

renderCart();
};

window.removeItem=function(id){
cart=cart.filter(x=>x.id!==id);
renderCart();
};
async function order(){
if(!cart.length)return msg("Add an item first.");
const customer_name=document.getElementById("name").value.trim();
const phone=document.getElementById("phone").value.trim();
const address=document.getElementById("address").value.trim();
const pincode=document.getElementById("pin").value.trim();
const payment_method=document.getElementById("pay").value;
const total=cart.reduce((a,x)=>a+Number(x.price),0);
if(!customer_name||!phone||!address||!pincode||!payment_method)return msg("Please fill all fields");
if(payment_method==="Cash on Delivery"){
const r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customer_name,phone,address,pincode,payment_method,total})});
const j=await r.json();
if(r.ok&&j.id){msg("Order placed successfully! Order ID: "+j.id);cart=[];document.getElementById("total").textContent=0}
else msg(j.error||"Order failed");
return;
}
try{
const ro=await fetch("/api/razorpay/order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({amount:total})});
const jo=await ro.json();
if(!ro.ok)return msg(jo.error||"Unable to start payment");
const options={
key:jo.key_id,
amount:jo.amount,
currency:"INR",
name:"Kapil Medical",
description:"Medicine & Cosmetics",
order_id:jo.id,
handler:async function(response){
const vr=await fetch("/api/razorpay/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(response)});
const vj=await vr.json();
if(!vr.ok||!vj.ok)return msg(vj.error||"Payment verification failed");

const r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customer_name,phone,address,pincode,payment_method,total})});
const j=await r.json();

if(r.ok&&j.id){
msg("Payment successful! Order ID: "+j.id);
cart=[];
}else{
msg(j.error||"Order failed");
}
}
};

const rzp=new Razorpay(options);
rzp.open();
}catch(e){msg("Payment could not be started");}
}function msg(x){document.getElementById("msg").textContent=x}load();</script>

<script>
fetch("/api/products")
.then(r=>r.json())
.then(data=>{
document.getElementById("products").innerHTML=data.map(p=>`
<div class="card">
<div class="pic">${p.category==="Medicine"?"💊":"🧴"}</div>
<h3>${p.name}</h3>
<p>₹${p.price} • Stock ${p.stock}</p>
<p class="muted">${p.prescription_required?"Prescription verification required":""}</p>
<button type="button" onclick="add(${p.id})">Add to cart</button>
</div>
`).join("");
})
.catch(e=>{
document.getElementById("products").innerHTML="<p style='color:red'>Products error: "+e.message+"</p>";
});
</script>

</body>
</html>
