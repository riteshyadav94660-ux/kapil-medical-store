<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kapil Medical</title>
<style>body{font-family:system-ui;margin:0;background:#f5f8f7;color:#17202a}header{background:#087f5b;color:#fff;padding:16px;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.card{background:#fff;padding:16px;border-radius:14px}.pic{height:100px;background:#edf8f3;border-radius:10px;display:grid;place-items:center;font-size:42px}button{background:#087f5b;color:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:700}input,select,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccd5df;border-radius:8px;box-sizing:border-box}.muted{color:#66737b;font-size:13px}.cart{background:#fff;color:#087f5b;float:right}</style></head>
<body><header>💚 Kapil Medical <button class="cart" onclick="document.getElementById('checkout').scrollIntoView()">Cart: <span id="n">0</span></button></header>
<main class="wrap"><h1>Medicines & Cosmetics</h1><p>Pan-India delivery • Alamgirpur, Rewari, Haryana</p><div id="products" class="grid"></div><section id="checkout"><h2>Checkout</h2><div id="cart">Cart is empty.</div><input id="name" placeholder="Full name"><input id="phone" placeholder="Mobile number"><textarea id="address" placeholder="Complete address"></textarea><input id="pin" placeholder="PIN code"><select id="pay"><option>Cash on Delivery</option><option>Online payment — Razorpay</option></select><button onclick="order()">Place order</button><p id="msg" class="muted"></p></section></main>
<script>let ps=[],cart=[];async function load(){ps=await fetch("/api/products").then(r=>r.json());products.innerHTML=ps.map(p=>`<div class="card"><div class="pic">${p.category==="Medicine"?"💊":"🧴"}</div><h3>${p.name}</h3><p>₹${p.price} • Stock ${p.stock}</p><p class="muted">${p.prescription_required?"Prescription verification required":""}</p><button onclick="add(${p.id})">Add to cart</button></div>`).join("")}function add(id){let p=ps.find(x=>x.id===id);cart.push(p);n.textContent=cart.length;document.getElementById("cart").textContent=cart.map(x=>x.name).join(", ")}async function order(){if(!cart.length)return msg("Add an item first.");let total=cart.reduce((a,x)=>a+x.price,0),b={customer_name:name.value,phone:phone.value,address:address.value,pincode:pin.value,payment_method:pay.value,total};let r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}),j=await r.json();msg(j.id?"Order placed successfully! Order ID: "+j.id:(j.error||"Order failed")}function msg(x){document.getElementById("msg").textContent=x}load();</script></body></html>
